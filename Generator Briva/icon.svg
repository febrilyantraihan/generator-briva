<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ontrackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="40%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#7C2D12" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle with Luxury Brand Gradient -->
  <rect width="512" height="512" rx="116" fill="url(#ontrackGrad)" />
  
  <!-- Subtle Frosted Inner Border -->
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6" />

  <!-- Iconic 3-Tier Isometric Data & BRIVA Financial Stack -->
  <g filter="url(#subtleShadow)">
    <!-- Top Layer (Data Foundation / Transaction Disc) -->
    <polygon points="256,96 410,172 256,248 102,172" fill="#FFFFFF" />
    
    <!-- Middle Chevron Layer -->
    <path d="M102,272 L256,348 L410,272" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Bottom Chevron Layer -->
    <path d="M102,364 L256,440 L410,364" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
