<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: auto; }
    iframe { width: 360px; height: 1400px; border: none; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="index.html"></iframe>
  <script>
    const iframe = document.getElementById('appFrame');
    function setupTest() {
      try {
        const win = iframe.contentWindow;
        if (win && win.switchTab) {
          win.switchTab('akun');
          if (win.loadPpdbSampleData) win.loadPpdbSampleData();
          if (win.switchPpdbSubtab) win.switchPpdbSubtab('siswa');
          const cont = win.document.getElementById('mainContentContainer');
          if (cont) cont.scrollTo({ top: 0, behavior: 'smooth' });
        }
      } catch (e) {
        console.error(e);
      }
    }
    iframe.onload = function() {
      setTimeout(setupTest, 400);
      setTimeout(setupTest, 1200);
    };
  </script>
</body>
</html>
