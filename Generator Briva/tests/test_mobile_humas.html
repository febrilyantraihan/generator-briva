<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: auto; }
    iframe { width: 360px; height: 1400px; border: none; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="index.html"></iframe>
  <script>
    const iframe = document.getElementById('appFrame');
    iframe.onload = function() {
      setTimeout(() => {
        const win = iframe.contentWindow;
        if (win.switchTab) win.switchTab('humas');
        const cont = win.document.getElementById('mainContentContainer');
        if (cont) cont.scrollTo({ top: 0, behavior: 'smooth' });
      }, 800);
    };
  </script>
</body>
</html>
